# Worker da API do LAB V2 (conta Cloudflare pessoal).
# Segredos (nunca neste arquivo):  npx wrangler secret put DATABASE_URL
#                                  npx wrangler secret put ADMIN_TOKEN
#                                  npx wrangler secret put AMICTA_CHAVE / AMICTA_WEBHOOK (quando ligar a Amicta)
name = "lab-v2-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Login do administrador pelo Supabase (nada aqui é segredo). O login só liga quando as três existem;
# falta SUPABASE_ANON_KEY (chave "publishable", pública): npx wrangler secret put SUPABASE_ANON_KEY, ou ponha em [vars].
[vars]
SUPABASE_URL = "https://jthutggtstdxldxjbiup.supabase.co"
ADMIN_EMAIL = "brunobsantosmoraes@gmail.com"

[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
