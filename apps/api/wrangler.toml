ADMIN_EMAIL = "brunobsantosmoraes@gmail.com"
SUPABASE_ANON_KEY = "sb_publishable_1ClG_ttoQEEn1QDs95F8wA_Y_FYSs_g"   # chave pública (publishable), pode ficar no repositório

